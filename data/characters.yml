---
- name: Aria Valentine
  cards:
    - name: Calm Reload
      quote: "I was once looked down on too."
      effect: |
        [ENTER] GEARLINK ④: Ready all of your GEAR cards.
        [DRIVE]: Choose one:
        • Target 1 of your opponent's DRIVE cards, destroy it.
        • You may discard 1 card from your hand. If you do, draw 1 card.
    - name: Magnificent Swing
      quote: "If you can dodge this, I'll commend you."
      effect: |
        [ENTER] GEARLINK ②: Target your opponent or 1 of their arts and deal the target 3 damage.
        [ATTACK] Target your opponent or 1 of their arts and deal the target 2 damage.
    - name: Terrifying Bullet
      quote: "Yes, checkmate."
      effect: |
        When this art deals damage to your opponent, the damage is doubled.
        [ATTACK] GEARLINK ④: Deals 3 damage to all of your opponent's arts.
- name: Canon Bennett
  cards:
    - name: Animal Cooperation
      quote: "Potato, ready, set, go!!"
      effect: |
        While this art is in play, your other arts get +1 power.
        [ATTACK] GEARLINK ①: Find 1 "Animal Cooperation" card in your deck and put it into play. Shuffle your deck.
    - name: Superior Talent
      quote: "Potato, show them!"
      effect: |
        [ENTER] GEARLINK ②: Choose one:
        • You gain 1 GEAR card.
        • Target 1 of your arts, it gains: "This turn, this art can't be blocked by your opponent's arts.".
        • Target 1 of your arts, it gets +3 power until the end phase.
    - name: White Wolf's Charge
      quote: "Potato, special attack ♪"
      effect: |
        This art gets +X power. X is the number of "Animal Cooperation" cards in your discard pile.
        [DRIVE]: Target 1 of your art and 1 of your opponent's arts. Deal 4 damage to each target.
- name: Lelia Rosenkreuz
  cards:
    - name: Blood-stained Crimson Wings
      quote: "Splendid, aren't they?"
      effect: |
        [ENTER]: Target 1 of your arts, destroy it. Then, choose one:
        • You draw 2 cards.
        • You gain 4 life.
        • Target 1 "Bewitching Reward" in your discard pile, add it to your hand.
    - name: Ultimate Price
      quote: "Until you get what you want."
      effect: |
        [ENTER]: You lose 4 life.
        [ENTER] GEARLINK ①: Reveal the top 3 cards of your deck, add 1 to your hand, discard the rest.
        [EXIT]: Target your opponent or 1 of their arts, deal the target 4 damage.
    - name: Bewitching Reward
      quote: "I'll take your life."
      effect: |
        [ACTIVE] [DRAIN]
        [ENTER]: You lose 6 life.
        [ENTER] GEARLINK Ⓧ: Target X "Bewitching Reward" in your discard pile and DRIVE them into this art.
        [ATTACK]: You may discard 1 DRIVE card from this art. If you do, destroy 1 of your opponent's arts with the lowest power.
- name: Charlotte Olivier
  cards:
    - name: Moment of Silence
      quote: "I am reading!"
      effect: |
        [ENTER]: Reveal the top 3 cards of your deck, add 1 to your hand, return the rest to the bottom of your deck in any order.
        [RETREAT] GEARLINK ①: target 1 of your your arts and ready it.
    - name: Presence of Mind
      quote: "I won't miss that opening!"
      effect: |
        [ENTER] GEARLINK ②: You gain 5 life.
        [ATTACK]: Target 1 of your opponent's exhausted arts, destroy it.
    - name: Unwavering Will
      quote: "I can't go easy on you."
      effect: |
        For each DRIVE card under this art, it gets +1 power.
        [ATTACK] GEARLINK ①: Target 1 of your opponent's arts, ready it, it must block this art. Then, ready this art, you gain 2 life.
- name: Sharon Crawford
  cards:
    - name: Sword of Might and Wisdom
      quote: "Leave the rearguard to me and go wild."
      effect: |
        When 1 of your opponent's arts [EXIT], target your opponent and deal them 1 damage.
        [EXIT] GEARLINK ②: Target 1 art in your discard pile and put it into play.
    - name: Raging Flame
      quote: "Feel honored to be burned."
      effect: |
        [ENTER] GEARLINK ①: Discard the top 4 cards of your deck.
        [ATTACK]: Target one of your opponent's arts, deal it 3 damage.
    - name: Purple Mist's Guidance
      quote: "I'll scatter them beautifully."
      effect: |
        This art gains all of the following effects if the number of cards in your discard pile is:
        • ≥ 10: [ACTIVE]
        • ≥ 15: [DRIVE]: Target 1 of your opponent's arts, destroy it.
        • ≥ 20: This art gets +6 power.
        • ≥ 25: When this art deals damage to your opponent, you win the game.
- name: Lucia Silveira
  cards:
    - name: Theory of Decay and Destruction
      quote: "I'll show you the results of my research."
      effect: |
        [RETREAT] GEARLINK ①: Choose one:
        • You gain 3 life.
        • Target your opponent, randomly discard up to 2 cards from their hand.
        • Target 1 of your opponent's arts and deal it 3 damage. If it [EXIT], banish it instead.
    - name: Synthesis of Void and Wisdom
      quote: "Even the light seeping through my fingers is focusing..."
      effect: |
        When this art gets its 6th DRIVE card, ready all your arts.
        [DRIVE]: Target 2 of your face down GEAR cards, return them to the GEAR area. Then, gain 2 GEAR cards.
    - name: "Fabricated Power"
      quote: "I'll fight with the full power of Creation."
      effect: |
        [ENTER] GEARLINK ②: Take 1 card from your hand, flip it face down, DRIVE it into one of your arts on the field. That card is now considered a DRIVE card.
        [ATTACK] GEARLINK ②: Until the end phase, this art gets +X power. X is the number of your face down GEAR cards.
- name: Islay Rothery
  cards:
    - name: Transfer Operation
      quote: "Do you think you can win?"
      effect: |
        [ENTER] GEARLINK ①: Reveal 5 cards from the top of your deck and discard them. Then, target 3 cards in your discard pile and return them to the bottom of your deck in any order.
        [EXIT] GEARLINK ①: Reveal 1 card from the bottom of your deck and put it into play.
    - name: State of Transcendence
      quote: "Sorry, your plan didn't work."
      effect: |
        [SPIKE]
        [ATTACK] GEARLINK ①: Until the end phase, this art gets +3 power.
        [EXIT] GEARLINK ①: You may discard 1 "Chosen for Condemnation" from your hand. If you do so, target 1 of your opponent's arts and return it to the bottom of their deck.
    - name: Chosen for Condemnation
      quote: "Let's get this over with."
      effect: |
        [ENTER] GEARLINK ④: Destroy all other arts.
        [DRIVE] GEARLINK ①: Target your opponent or 1 of their arts and deal the target 4 damage.
- name: Alicia Heart
  cards:
    - name: Radiant Magical Power
      quote: "I got your back, leave it to me."
      effect: |
        [ENTER]: Target 1 card from your hand, put it into play.
        [RETREAT] GEARLINK ①: Choose one:
        • You gain 3 life.
        • Target 1 of your opponent's arts, exhaust it.
    - name: Outstanding Intellect
      quote: "It's important to plan ahead, right?"
      effect: |
        At the end of your opponent's ready & draw phase, GEARLINK ④: Exhaust all of their arts.
        [ENTER]: You may target 2 of your arts and destroy them. If you do, target your opponent or 1 of their arts and deal the target 3 damage.
    - name: Looping Dark Barrier
      quote: "You shall not pass"
      effect: |
        When this art would take damage, you may instead discard 1 of its DRIVE cards.
        [DRIVE]: Ready this art.
- name: Alice Laval
  cards:
    - name: Flickering shadow
      quote: "Oh, you are still standing?"
      effect: |
        [ENTER]: GEARLINK ①: Draw 2 cards. Discard 1 card.
        [ATTACK]: You may discard 1 card. If you do, target your opponent or 1 of their arts and deal the target 4 damage.
    - name: Surreal Strength
      quote: "Heh, so that's all you've got."
      effect: |
        [ACTIVE]
        [ENTER]: You may banish 3 cards from your discard pile. If you do, this art gains DRAIN for this turn.
        [ATTACK]: You may discard 2 cards. If you do, target 1 "Surreal Strength" in your discard pile, DRIVE it into this art.
    - name: Scornful Gaze
      quote: "Can you just disappear, please?"
      effect: |
        [SPIKE]
        [DRIVE] GEARLINK ①: You may discard 1 card. If you do, target 1 card in your discard pile, add it to your hand.
        [ATTACK]: You may banish 6 cards from your discard pile. If you do, this art gets +3 power until the end phase.
- name: Kaguya Tsukimiya
  cards:
    - name: Clear as Mirror, Still as Water
      quote: "Heaven and Fate shall be on my side!"
      effect: |
        Damage taken by you or your arts is reduced by 1.
        [ENTER] GEARLINK ①: Reveal the top 4 cards of your deck. Add all Kagura-bound arts to your hand, discard the rest.
    - name: Gale Arrow
      quote: "Your corruption will be purified!"
      effect: |
        [ENTER]: You may target 1 "Clear as Mirror, Still as Water" on your field and put it into your GEAR gauge. If you do, treat it as a [TALISMAN].
        [ATTACK] GEARLINK ②: Target 1 of your opponent's arts, banish it.
    - name: Sunlit Blade
      quote: "I shall strike with all my might!"
      effect: |
        [ENTER] GEARLINK ⑧: On your opponent's next turn, all of their exhausted art and GEAR cards will not ready.
        [DRIVE]: Deal X damage to all of your opponent's arts where X is the number of [TALISMAN] that you have.
- name: Darkside Lelia
  cards:
    - name: Game of Silence
      quote: "I bet you still can’t see it"
      effect: |
        [ENTER]: Target up to 2 cards in your discard pile. You may banish them.
        [EXIT] GEARLINK ①: Target one of your opponent's arts, deal it X damage where X is the number of your banished cards.
    - name: Dark Folly
      quote: "I feel no pain."
      effect: |
        [ENTER] GEARLINK ①: Target 1 of your banished arts, put it into play.
        [DRIVE] GEARLINK ②: Target 1 of your opponent's arts, deal it X damage, you gain X life where X is the number of your banished cards.
    - name: Impending doom
      quote: "You are so helpless."
      effect: |
        This art gets +X power where X is the number of your banished cards.
        [ENTER] GEARLINK ⑥: Deal X damage to all arts where X is the number of your banished cards.
- name: Lilly Campbell
  cards:
    - name: Domain of Joy
      quote: "This is easy~♪ So easy~♪"
      effect: |
        If you would take any damage from an effect, this art takes that damage instead.
        [ENTER] GEARLINK ①: Choose one:
        • You gain 4 life.
        • Target one of your opponent's arts, exhaust it.
    - name: Emerald Gale
      quote: "Hah! You let your guard down!"
      effect: |
        [ENTER]: Target a DRIVE card belonging to you or your opponent. You may return it to the owner's hand.
        [ATTACK] GEARLINK ①: Target one of your opponent's arts, deal it 3 damage. If it would [EXIT], banish it instead.
    - name: Soaring Emerald Wings
      quote: "Leave the buffing to me!"
      effect: |
        If this art has 3 or more DRIVE cards, all your arts gain +3 power and [SPIKE].
        [DRIVE]: Look at the top card of your deck, you may put it into your discard pile.
